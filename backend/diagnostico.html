<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validação do SabIA</title>
<style>
body{font:16px system-ui;margin:0;background:#f5f7f5;color:#172e24}main{max-width:850px;margin:40px auto;padding:24px;background:white;border-radius:12px}h1{margin-top:0}label{display:block;font-weight:600}textarea{box-sizing:border-box;width:100%;min-height:100px;margin:10px 0;font:inherit;padding:12px}button{font:inherit;background:#174d35;color:white;border:0;padding:12px 20px;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f2;padding:16px}small{display:block;margin:12px 0}
</style>
<main><h1>Validação do SabIA</h1>
<p>Ambiente de teste. As perguntas usam a cota do Gemini. As respostas não são armazenadas nesta página.</p>
<form id="form"><label for="message">Pergunta de teste</label><textarea id="message" required maxlength="2000"></textarea><button id="send">Testar resposta</button></form>
<small id="status" role="status">Pronto para testar.</small><pre id="result" aria-label="Resultado"></pre></main>
<script>
const form=document.getElementById('form'),button=document.getElementById('send'),status=document.getElementById('status'),result=document.getElementById('result');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;status.textContent='Consultando o SabIA…';result.textContent='';
 try{
  const response=await fetch('/api/assistente',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.getElementById('message').value,history:[]}),signal:AbortSignal.timeout(45000)});
  const data=await response.json();status.textContent='HTTP '+response.status;result.textContent=JSON.stringify(data,null,2);
 }catch(error){status.textContent='Falha na consulta';result.textContent=error.name==='TimeoutError'?'A resposta demorou mais de 45 segundos.': 'Não foi possível concluir o teste.';}
 finally{button.disabled=false;}
});
</script></html>
